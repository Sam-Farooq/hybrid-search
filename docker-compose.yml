services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      # 1g heap. The default is a quarter of host RAM, which on a laptop with
      # Qdrant and a model loaded alongside is how the OOM killer gets involved.
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.11.3
    ports: ["6333:6333"]
    volumes: ["qdrant:/qdrant/storage"]

volumes:
  qdrant:
